<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- Firebase App (Core) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <!-- Firebase Authentication -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <!-- Firebase Firestore (Database) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription - Jerix Fusion Bites</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }

        .auth-card {
            background-color: #111;
            border: 2px solid #ffd700;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.2);
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #333;
        }

        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            color: #888;
            font-size: 1.1em;
            font-weight: bold;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            color: #ffd700;
            border-bottom: 3px solid #ffd700;
            margin-bottom: -2px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ffd700;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-size: 1em;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #ffd700;
            outline: none;
        }

        .auth-submit-btn {
            width: 100%;
            background-color: #ffd700;
            color: #000;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-transform: uppercase;
        }

        .auth-submit-btn:hover {
            background-color: #ffcc00;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        .message-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .message-box.error {
            background-color: rgba(255, 0, 0, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        .message-box.success {
            background-color: rgba(0, 255, 0, 0.2);
            color: #51cf66;
            border: 1px solid #51cf66;
        }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="header-left">
            <a href="index.html" class="auth-btn">← Retour à l'accueil</a>
        </div>
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo Jerix Fusion Bites" class="logo" style="height: 100px; width: auto; object-fit: contain;">
        </div>
        <div style="flex: 1;"></div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Toggle Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('signin')">Connexion</button>
                <button class="auth-tab" onclick="switchTab('signup')">Inscription</button>
            </div>

            <!-- Sign In Form -->
            <form id="signinForm" class="auth-form active" onsubmit="handleAuth(event, 'signin')">
                <div class="form-group">
                    <label for="signinEmail">Adresse Email</label>
                    <input type="email" id="signinEmail" required placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label for="signinPassword">Mot de passe</label>
                    <input type="password" id="signinPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="auth-submit-btn">Se connecter</button>
            </form>

            <!-- Sign Up Form -->
            <form id="signupForm" class="auth-form" onsubmit="handleAuth(event, 'signup')">
                <div class="form-group">
                    <label for="signupName">Nom complet</label>
                    <input type="text" id="signupName" required placeholder="Votre Nom">
                </div>
                <div class="form-group">
                    <label for="signupEmail">Adresse Email</label>
                    <input type="email" id="signupEmail" required placeholder="votre@email.com">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Mot de passe</label>
                    <input type="password" id="signupPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="auth-submit-btn">S'inscrire</button>
            </form>

            <div id="authMessage" class="message-box"></div>
            
            <a href="index.html" class="back-home">Visiter le site principal</a>
        </div>
    </div>

    <script>
    const firebaseConfig = {
  apiKey: "AIzaSyAFGnXNg51y82dtNVIR5Yd_JWYK1Aty5Yw",
  authDomain: "jerixrestaurant-12a9b.firebaseapp.com",
  projectId: "jerixrestaurant-12a9b",
  storageBucket: "jerixrestaurant-12a9b.firebasestorage.app",
  messagingSenderId: "347378956164",
  appId: "1:347378956164:web:af66d148cd20b417124fd1",
  measurementId: "G-CE02CK78XQ"
};

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Ensure session persistence across browser reloads
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(err => {
        console.error("Error setting persistence:", err);
    });

    const adminEmails = [
        "admin@jerixfusionbites.com",
        "jerix@jerixfusionbites.com",
        "manager@jerixfusionbites.com"
    ];

    function switchTab(tab) {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        document.getElementById('authMessage').style.display = 'none';

        if (tab === 'signin') {
            document.querySelectorAll('.auth-tab')[0].classList.add('active');
            document.getElementById('signinForm').classList.add('active');
        } else {
            document.querySelectorAll('.auth-tab')[1].classList.add('active');
            document.getElementById('signupForm').classList.add('active');
        }
    }

    async function handleAuth(event, type) {
        event.preventDefault();
        
        const email = type === 'signin' ? document.getElementById('signinEmail').value.trim() : document.getElementById('signupEmail').value.trim();
        const password = type === 'signin' ? document.getElementById('signinPassword').value.trim() : document.getElementById('signupPassword').value.trim();
        const name = type === 'signup' ? document.getElementById('signupName').value.trim() : "Utilisateur";
        const msgBox = document.getElementById('authMessage');

        msgBox.style.display = 'block';

        if (type === 'signup') {
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const role = adminEmails.includes(email.toLowerCase()) ? "admin" : "customer";
                
                await db.collection("users").doc(userCredential.user.uid).set({
                    name: name,
                    email: email,
                    role: role,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                msgBox.className = "message-box success";
                msgBox.textContent = "Inscription réussie ! Redirection...";
                setTimeout(() => window.location.href = "index.html", 1500);
            } catch (error) {
                msgBox.className = "message-box error";
                msgBox.textContent = "Erreur: " + error.message;
            }
        } else {
            try {
                await auth.signInWithEmailAndPassword(email, password);
                msgBox.className = "message-box success";
                msgBox.textContent = "Connexion réussie ! Redirection...";
                setTimeout(() => window.location.href = "index.html", 1500);
            } catch (error) {
                msgBox.className = "message-box error";
                msgBox.textContent = "Erreur de connexion. Vérifiez vos identifiants.";
            }
        }
    }
    </script>
</body>
</html>
