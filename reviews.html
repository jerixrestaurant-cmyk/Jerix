<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avis - Jerix Fusion Bites</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Header avec Logo Centré et Boutons de Navigation -->
    <header class="top-header">
        <nav class="top-nav">
            <a href="index.html#aboutSection" class="nav-link">About</a>
            <a href="index.html#menuSection" class="nav-link">Menu</a>
            <a href="reviews.html" class="nav-link active">Reviews</a>
            <a href="checkout.html" class="nav-link">Checkout</a>
            
            <!-- HIDDEN BY DEFAULT: Only rendered dynamically if authenticated as Admin -->
            <button id="adminToggleBtn" onclick="toggleAdminMode()" style="display: none; background: transparent; border: 1px solid #ffcc00; color: #ffcc00; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; cursor: pointer; margin-left: 10px;">
                Mode Admin: OFF
            </button>
        </nav>

        <div class="logo-container">
            <a href="index.html">
                <img src="logo.jpg" alt="Logo Jerix Fusion Bites" class="logo">
            </a>
        </div>
    </header>

    <!-- Page Content - Customer Reviews -->
    <section class="about-section" style="margin-top: 40px;">
        <div class="about-container">
            <h2 class="about-title">Avis Clients / Customer Reviews</h2>
            
            <!-- Formulaire pour ajouter un avis -->
            <div class="review-form-box" style="margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px dashed #444;">
                <h3 style="color: #ffcc00; margin-bottom: 15px; font-size: 1.2rem;">Laisser un avis</h3>
                <form id="reviewForm" style="display: flex; flex-direction: column; gap: 12px;">
                    <input type="text" id="reviewerName" placeholder="Votre nom (ex: Jean Dupont)" required style="padding: 10px; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: #fff;">
                    
                    <select id="reviewRating" style="padding: 10px; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: #ffcc00;">
                        <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ (5/5)</option>
                        <option value="⭐⭐⭐⭐">⭐⭐⭐⭐ (4/5)</option>
                        <option value="⭐⭐⭐">⭐⭐⭐ (3/5)</option>
                        <option value="⭐⭐">⭐⭐ (2/5)</option>
                        <option value="⭐">⭐ (1/5)</option>
                    </select>

                    <textarea id="reviewText" placeholder="Votre commentaire..." rows="3" required style="padding: 10px; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: #fff; resize: vertical;"></textarea>

                    <button type="submit" style="background-color: #ffcc00; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase;">Publier l'avis</button>
                </form>
            </div>

            <!-- Liste des avis -->
            <div class="about-content" id="reviewsList"></div>
        </div>
    </section>

    <script>
        // Firebase Configuration Sync
        const firebaseConfig = {
            apiKey: "AIzaSyAFGnXNg51y82dtNVIR5Yd_JWYK1Aty5Yw",
            authDomain: "jerixrestaurant-12a9b.firebaseapp.com",
            projectId: "jerixrestaurant-12a9b",
            storageBucket: "jerixrestaurant-12a9b.firebasestorage.app",
            messagingSenderId: "347378956164",
            appId: "1:347378956164:web:af66d148cd20b417124fd1",
            measurementId: "G-CE02CK78XQ"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const DEFAULT_REVIEWS = [
            { name: "Local Guide", rating: "⭐⭐⭐⭐⭐", text: "Amazing food and incredible flavors! The burgers and pizzas are top-notch.", date: "15/06/2026 à 14:30", reply: null },
            { name: "Food Enthusiast", rating: "⭐⭐⭐⭐⭐", text: "Fast service and super delicious tacos. Highly recommend!", date: "18/06/2026 à 19:15", reply: null },
            { name: "Client Régulier", rating: "⭐⭐⭐⭐⭐", text: "Le poulet biryani et les sandwichs escalope sont excellents. Service au top !", date: "22/06/2026 à 12:05", reply: null }
        ];

        let isLoggedInAdmin = false;
        let adminModeActive = false;

        document.addEventListener("DOMContentLoaded", () => {
            const reviewForm = document.getElementById("reviewForm");
            const reviewsList = document.getElementById("reviewsList");
            const adminToggleBtn = document.getElementById("adminToggleBtn");

            // Listen for changes in Auth state directly from Firebase
            auth.onAuthStateChanged((user) => {
                if (user) {
                    // Check user role in Firestore database
                    db.collection("users").doc(user.uid).get().then((doc) => {
                        if (doc.exists && doc.data().role === 'admin') {
                            isLoggedInAdmin = true;
                            adminToggleBtn.style.display = "inline-block";
                        } else {
                            revokeAdminState();
                        }
                        loadReviews();
                    }).catch(() => {
                        revokeAdminState();
                        loadReviews();
                    });
                } else {
                    revokeAdminState();
                    loadReviews();
                }
            });

            function revokeAdminState() {
                isLoggedInAdmin = false;
                adminModeActive = false;
                localStorage.removeItem("jerix_admin_logged");
                adminToggleBtn.style.display = "none";
            }

            function loadReviews() {
                const savedReviews = JSON.parse(localStorage.getItem("jerix_reviews")) || DEFAULT_REVIEWS;
                reviewsList.innerHTML = "";

                savedReviews.forEach((rev, index) => {
                    const item = document.createElement("div");
                    item.className = "review-item";
                    item.style.cssText = "margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px;";
                    
                    const displayDate = rev.date || rev.createdAt || "Récemment";

                    item.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                            <span style="color: #ffcc00; font-size: 1.1rem;">${rev.rating || "⭐⭐⭐⭐⭐"}</span>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span style="color: #777; font-size: 0.85rem;">${displayDate}</span>
                                ${(isLoggedInAdmin && adminModeActive) ? `
                                    <button onclick="deleteReview(${index})" style="background: #ff4444; color: #fff; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem;">Supprimer 🗑️</button>
                                ` : ''}
                            </div>
                        </div>
                        <p style="margin: 6px 0;">"${rev.text}"</p>
                        <small style="color: #888;">– ${rev.name}</small>

                        ${rev.reply ? `
                            <div style="margin-top: 12px; margin-left: 20px; padding: 10px; background: #222; border-left: 3px solid #ffcc00; border-radius: 4px;">
                                <div style="color: #ffcc00; font-weight: bold; font-size: 0.85rem; margin-bottom: 4px;">Réponse du propriétaire :</div>
                                <p style="color: #ddd; font-size: 0.9rem; margin: 0;">${rev.reply}</p>
                            </div>
                        ` : ''}

                        ${(isLoggedInAdmin && adminModeActive && !rev.reply) ? `
                            <div style="margin-top: 10px;">
                                <button onclick="toggleReplyForm(${index})" style="background: transparent; border: 1px solid #ffcc00; color: #ffcc00; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">Répondre 💬</button>
                                <div id="replyBox-${index}" style="display: none; margin-top: 10px;">
                                    <textarea id="replyText-${index}" placeholder="Rédiger votre réponse..." rows="2" style="width: 100%; padding: 8px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box;"></textarea>
                                    <button onclick="submitReply(${index})" style="margin-top: 6px; background: #ffcc00; color: #000; font-weight: bold; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">Envoyer la réponse</button>
                                </div>
                            </div>
                        ` : ''}
                    `;
                    reviewsList.appendChild(item);
                });
            }

            reviewForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const name = document.getElementById("reviewerName").value.trim();
                const rating = document.getElementById("reviewRating").value;
                const text = document.getElementById("reviewText").value.trim();

                const now = new Date();
                const options = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };
                const formattedDate = now.toLocaleDateString('fr-FR', options).replace(',', ' à');

                const newReview = { name, rating, text, date: formattedDate, reply: null };
                const savedReviews = JSON.parse(localStorage.getItem("jerix_reviews")) || DEFAULT_REVIEWS;
                savedReviews.unshift(newReview);
                localStorage.setItem("jerix_reviews", JSON.stringify(savedReviews));

                reviewForm.reset();
                loadReviews();
            });

            window.deleteReview = function(index) {
                if (!isLoggedInAdmin) return;
                if (confirm("Êtes-vous sûr de vouloir supprimer cet avis définitivement ?")) {
                    const savedReviews = JSON.parse(localStorage.getItem("jerix_reviews")) || DEFAULT_REVIEWS;
                    savedReviews.splice(index, 1);
                    localStorage.setItem("jerix_reviews", JSON.stringify(savedReviews));
                    loadReviews();
                }
            };

            window.toggleReplyForm = function(index) {
                const box = document.getElementById(`replyBox-${index}`);
                if (box) box.style.display = box.style.display === "none" ? "block" : "none";
            };

            window.submitReply = function(index) {
                if (!isLoggedInAdmin) return;
                const text = document.getElementById(`replyText-${index}`).value.trim();
                if (!text) return;

                const savedReviews = JSON.parse(localStorage.getItem("jerix_reviews")) || DEFAULT_REVIEWS;
                savedReviews[index].reply = text;
                localStorage.setItem("jerix_reviews", JSON.stringify(savedReviews));
                loadReviews();
            };

            window.toggleAdminMode = function() {
                if (!isLoggedInAdmin) return;
                adminModeActive = !adminModeActive;
                
                if (adminModeActive) {
                    adminToggleBtn.textContent = "Mode Admin: ON";
                    adminToggleBtn.style.background = "#ffcc00";
                    adminToggleBtn.style.color = "#000";
                } else {
                    adminToggleBtn.textContent = "Mode Admin: OFF";
                    adminToggleBtn.style.background = "transparent";
                    adminToggleBtn.style.color = "#ffcc00";
                }
                loadReviews();
            };

            loadReviews();
        });
    </script>
</body>
</html>
